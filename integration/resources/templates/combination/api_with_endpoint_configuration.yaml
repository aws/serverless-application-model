Parameters:
  Bucket:
    Type: String
  CodeKey:
    Type: String
  SwaggerKey:
    Type: String
  Config:
    Type: String
    Default: REGIONAL

Resources:
  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      Auth:
        DefaultAuthorizer: AWS_IAM
      StageName: Prod
      EndpointConfiguration: {Ref: Config}
      DefinitionUri: ${definitionuri}

Metadata:
  SamTransformTest: true
