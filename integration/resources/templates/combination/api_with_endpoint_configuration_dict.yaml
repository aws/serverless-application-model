    Type: AWS::Serverless::Api
    Properties:
      Auth:
        DefaultAuthorizer: AWS_IAM
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      DefinitionUri: ${definitionuri}

Metadata:
  SamTransformTest: true
