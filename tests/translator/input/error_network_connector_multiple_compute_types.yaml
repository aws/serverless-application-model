AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NetworkConnector with more than one ComputeTypes value (exactly one is
  allowed)

Resources:
  NetworkConnectorMultipleComputeTypes:
    Type: AWS::Serverless::NetworkConnector
    Properties:
      ComputeTypes:
      - MicroVm
      - WebFunction
      VpcConfig:
        SubnetIds:
        - subnet-abc
        SecurityGroupIds:
        - sg-123
        NetworkProtocol: IPv4
