AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AcceleratorConfig expressed with intrinsics is passed through unvalidated

Parameters:
  AcceleratorMemory:
    Type: Number
    Default: 24
  UseGpu:
    Type: String
    Default: 'true'

Conditions:
  GpuEnabled:
    Fn::Equals:
    - Ref: UseGpu
    - 'true'

Resources:
  MyCapacityProvider:
    Type: AWS::Serverless::CapacityProvider
    Properties:
      VpcConfig:
        SubnetIds:
        - subnet-12345678
        SecurityGroupIds:
        - sg-12345678

  # Inner value is an intrinsic: the pydantic model accepts it via SamIntrinsicable.
  InnerIntrinsicFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-gpu-image:latest
      MemorySize: 2048
      CapacityProviderConfig:
        Arn: !GetAtt MyCapacityProvider.CapacityProviderArn
      AcceleratorConfig:
        AcceleratorMemorySize: !Ref AcceleratorMemory

  # Whole block is an unresolved intrinsic: validation is skipped, CloudFormation resolves it.
  WholeBlockIntrinsicFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-gpu-image:latest
      MemorySize: 2048
      CapacityProviderConfig:
        Arn: !GetAtt MyCapacityProvider.CapacityProviderArn
      AcceleratorConfig: !If
      - GpuEnabled
      - AcceleratorMemorySize: 24
      - !Ref AWS::NoValue
