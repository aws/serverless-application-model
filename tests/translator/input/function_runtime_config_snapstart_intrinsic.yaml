# SnapStart.ApplyOn is an Fn::If intrinsic on a 'custom' runtime. The V4 coupling check
# only rejects a SnapStart whose ApplyOn RESOLVES to an enabled value; an unresolvable
# intrinsic cannot be proven enabled (it may resolve to 'None'), so it must PASS THROUGH
# and defer to the service at deploy time. This fixture locks that fail-open behaviour.
Transform: AWS::Serverless-2016-10-31

Conditions:
  UseSnapStart: !Equals [true, true]

Resources:
  MyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://sam-demo-bucket/hello.zip
      Handler: hello.handler
      Runtime: custom
      RuntimeConfig:
        RuntimeArn: arn:aws:lambda:us-east-1:123456789012:runtime/my-python312-runtime
        RuntimeAlias: production
      SnapStart:
        ApplyOn: !If [UseSnapStart, None, PublishedVersions]
