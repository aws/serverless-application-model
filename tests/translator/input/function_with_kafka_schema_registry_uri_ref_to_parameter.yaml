AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  GlueRegistryArn:
    Type: String
    Default: arn:aws:glue:us-west-2:012345678901:registry/registry1
  ConfluentRegistryUrl:
    Type: String
    Default: https://schema-registry.example.com
Resources:
  MyMskStreamProcessorWithGlueRegistryParameter:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs12.x
      Handler: index.handler
      CodeUri: s3://sam-demo-bucket/kafka.zip
      Events:
        MyMskEvent:
          Type: MSK
          Properties:
            StartingPosition: LATEST
            Stream: !Sub arn:${AWS::Partition}:kafka:${AWS::Region}:012345678901:cluster/mycluster/6cc0432b-8618-4f44-bccc-e1fbd8fb7c4d-2
            Topics:
            - MyDummyTestTopic
            ConsumerGroupId: consumergroup1
            SchemaRegistryConfig:
              SchemaRegistryURI: !Ref GlueRegistryArn
              EventRecordFormat: JSON
              SchemaValidationConfigs:
              - Attribute: KEY
  MyMskStreamProcessorWithConfluentRegistryParameter:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs12.x
      Handler: index.handler
      CodeUri: s3://sam-demo-bucket/kafka.zip
      Events:
        MyMskEvent:
          Type: MSK
          Properties:
            StartingPosition: LATEST
            Stream: !Sub arn:${AWS::Partition}:kafka:${AWS::Region}:012345678901:cluster/mycluster/6cc0432b-8618-4f44-bccc-e1fbd8fb7c4d-2
            Topics:
            - MyDummyTestTopic
            ConsumerGroupId: consumergroup1
            SchemaRegistryConfig:
              SchemaRegistryURI: !Ref ConfluentRegistryUrl
              EventRecordFormat: JSON
              SchemaValidationConfigs:
              - Attribute: KEY
              AccessConfigs:
              - Type: BASIC_AUTH
                URI: arn:aws:secretsmanager:us-west-2:123456789012:secret:my-path/my-schema-secret-1a2b3c
  MyKafkaStreamProcessorWithGlueRegistryParameter:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://sam-demo-bucket/kafka.zip
      Handler: index.kafka_handler
      Runtime: python3.9
      Events:
        MyKafkaCluster:
          Type: SelfManagedKafka
          Properties:
            KafkaBootstrapServers:
            - abc.xyz.com:9092
            - 123.45.67.89:9096
            Topics:
            - Topic1
            SourceAccessConfigurations:
            - Type: SASL_SCRAM_512_AUTH
              URI: arn:aws:secretsmanager:us-west-2:123456789012:secret:my-path/my-secret-name-1a2b3c
            - Type: VPC_SUBNET
              URI: subnet:subnet-12345
            - Type: VPC_SECURITY_GROUP
              URI: security_group:sg-67890
            ConsumerGroupId: consumergroup1
            SchemaRegistryConfig:
              SchemaRegistryURI: !Ref GlueRegistryArn
              EventRecordFormat: JSON
              SchemaValidationConfigs:
              - Attribute: KEY
  MyKafkaStreamProcessorWithConfluentRegistryParameter:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://sam-demo-bucket/kafka.zip
      Handler: index.kafka_handler
      Runtime: python3.9
      Events:
        MyKafkaCluster:
          Type: SelfManagedKafka
          Properties:
            KafkaBootstrapServers:
            - abc.xyz.com:9092
            - 123.45.67.89:9096
            Topics:
            - Topic1
            SourceAccessConfigurations:
            - Type: SASL_SCRAM_512_AUTH
              URI: arn:aws:secretsmanager:us-west-2:123456789012:secret:my-path/my-secret-name-1a2b3c
            - Type: VPC_SUBNET
              URI: subnet:subnet-12345
            - Type: VPC_SECURITY_GROUP
              URI: security_group:sg-67890
            ConsumerGroupId: consumergroup1
            SchemaRegistryConfig:
              SchemaRegistryURI: !Ref ConfluentRegistryUrl
              EventRecordFormat: JSON
              SchemaValidationConfigs:
              - Attribute: KEY
              AccessConfigs:
              - Type: BASIC_AUTH
                URI: arn:aws:secretsmanager:us-west-2:123456789012:secret:my-path/my-schema-secret-1a2b3c
