AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Test ManagedResourceTags - all configurations

Parameters:
  Environment:
    Type: String
    Default: Production
  EnablePropagation:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'

Globals:
  CapacityProvider:
    ManagedResourceTags:
      Propagate: !Ref EnablePropagation

Resources:
  CpExplicitTagsWithRef:
    Type: AWS::Serverless::CapacityProvider
    Properties:
      VpcConfig:
        SubnetIds:
        - subnet-00000000
        SecurityGroupIds:
        - sg-00000000
      ManagedResourceTags:
        Propagate: false
        Tags:
          Environment: !Ref Environment
          Team: Tooling

  CpInheritsGlobal:
    Type: AWS::Serverless::CapacityProvider
    Properties:
      VpcConfig:
        SubnetIds:
        - subnet-11111111
        SecurityGroupIds:
        - sg-11111111

  CpOverridePropagateFalse:
    Type: AWS::Serverless::CapacityProvider
    Properties:
      VpcConfig:
        SubnetIds:
        - subnet-22222222
        SecurityGroupIds:
        - sg-22222222
      ManagedResourceTags:
        Propagate: false

  CpOverrideWithExplicitTags:
    Type: AWS::Serverless::CapacityProvider
    Properties:
      VpcConfig:
        SubnetIds:
        - subnet-33333333
        SecurityGroupIds:
        - sg-33333333
      ManagedResourceTags:
        Propagate: false
        Tags:
          Environment: !Ref Environment
          Team: !Sub '${AWS::StackName}-tooling'
