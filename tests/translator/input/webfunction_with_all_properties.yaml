Resources:
  MyWebFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      Runtime: nodejs24.x
      CodeUri: s3://sam-demo-bucket/webfunc.zip
      Timeout: 120
      EntryPoint: app.js
      MaxConcurrencyPerEnvironment: 100
      EnvironmentVariables:
        MY_VAR: my_value
        NUMERIC_VAR: 42
        BOOL_VAR: true
      EndpointName: staging
      EndpointType: MultiRegion
      EndpointDescription: prod endpoint
      ScalingConfig:
        MaxEnvironments: 50
      ThrottleConfig:
        RateLimit: 5000
      AuthType: IamAuth
      AutoDeploymentMode: Disabled
      RevisionWeights:
        rev-abc: 80
        rev-def: 20
      ReplicaRegions:
      - US
      KmsKeyArn: arn:aws:kms:us-east-1:123456789012:key/abcd1234
      RevisionDescription: initial revision
      Tags:
        Department: Engineering
