AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Test ManagedResourceTags.Propagate rejects intrinsic functions

Parameters:
  EnablePropagation:
    Type: String
    Default: 'true'

Resources:
  CpPropagateWithRef:
    Type: AWS::Serverless::CapacityProvider
    Properties:
      VpcConfig:
        SubnetIds:
        - subnet-12345678
        SecurityGroupIds:
        - sg-12345678
      ManagedResourceTags:
        Propagate: !Ref EnablePropagation
