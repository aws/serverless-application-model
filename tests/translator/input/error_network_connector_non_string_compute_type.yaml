AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NetworkConnector with a non-string ComputeTypes value

Resources:
  NetworkConnectorNonStringComputeType:
    Type: AWS::Serverless::NetworkConnector
    Properties:
      ComputeTypes:
      - 5
      VpcConfig:
        SubnetIds:
        - subnet-abc
        SecurityGroupIds:
        - sg-123
        NetworkProtocol: IPv4
