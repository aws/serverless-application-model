AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NetworkConnector with PropagateTags flowing tags to auto-generated role

Resources:
  MyNetworkConnector:
    Type: AWS::Serverless::NetworkConnector
    Properties:
      VpcConfig:
        SubnetIds:
        - subnet-0abc123
        SecurityGroupIds:
        - sg-0app
        NetworkProtocol: IPv4
      Tags:
        Environment: Production
        Team: Platform
      PropagateTags: true
