AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AcceleratorConfig without CapacityProviderConfig should fail

Resources:
  MyGPUFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-gpu-image:latest
      MemorySize: 2048
      AcceleratorConfig:
        AcceleratorMemorySize: 24
