AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MicrovmImage with all properties, BuildRoleArn omitted (auto-generated)

Resources:
  MyAgent:
    Type: AWS::Serverless::MicrovmImage
    Properties:
      Name: my-agent
      CodeUri: s3://my-bucket/agent.zip
      BaseImageArn: arn:aws:lambda:::microvm-image:lambda-microvms-al2023-2
      BaseImageVersion: '2.0'
      Description: My production agent
      EgressNetworkConnectors:
      - arn:aws:lambda:::network-connector:aws-network-connector:INTERNET_EGRESS
      CpuConfigurations:
      - Architecture: ARM_64
      Resources:
      - MinimumMemoryInMiB: 1024
      AdditionalOsCapabilities:
      - ALL
      Hooks:
        Port: 9000
        MicrovmHooks:
          Run: ENABLED
          RunTimeoutInSeconds: 30
          Suspend: ENABLED
          Resume: ENABLED
        MicrovmImageHooks:
          Ready: ENABLED
      EnvironmentVariables:
        LOG_LEVEL: info
        APP_ENV: production
      Logging:
        CloudWatch:
          LogGroup: /aws/lambda-microvms/my-agent
      Tags:
        Environment: Production
        Team: Platform
