Globals:
  Function:
    Tags:
      env: prod

Resources:
  ApiFunction: # Adds a GET api endpoint at "/" to the ApiGatewayApi via an Api event
    Type: AWS::Serverless::Function
    Properties:
      PropagateTags: true
      Tags:
        app: foo
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /
            Method: get
      Runtime: python3.7
      Handler: index.handler
      InlineCode: |-
        def handler(event, context):
            return {'body': 'Hello World!', 'statusCode': 200}
