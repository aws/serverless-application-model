AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Basic NetworkConnector with auto-generated OperatorRole

Resources:
  MyNetworkConnector:
    Type: AWS::Serverless::NetworkConnector
    Properties:
      VpcConfig:
        SubnetIds:
        - subnet-0abc123
        - subnet-0def456
        SecurityGroupIds:
        - sg-0app
        NetworkProtocol: IPv4
      Tags:
        Environment: Production
        Team: Platform
