AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NetworkConnector with service-managed Elastic IP addresses and a customer-provided
  OperatorRole, which is passed through unchanged

Resources:
  MyNetworkConnector:
    Type: AWS::Serverless::NetworkConnector
    Properties:
      VpcConfig:
        SubnetIds:
        - subnet-0abc123
        SecurityGroupIds:
        - sg-0abcd0ef
        NetworkProtocol: IPv4
        ElasticIpConfiguration:
          Type: ServiceManaged
      OperatorRole: arn:aws:iam::123456789012:role/MyOperatorRole
